# Mosquitto MQTT Broker Configuration
# Fleet & Asset Tracking System — Dev Profile

# --- Listeners ---
listener 1883
protocol mqtt

listener 9001
protocol websockets

# --- Authentication ---
allow_anonymous false
password_file /mosquitto/config/passwords.txt

# --- Topic permissions ---
# Devices can only publish to their own topic
acl_file /mosquitto/config/acl.conf

# --- Retained messages ---
# Enable retained messages for last-known position (F1.4)
retain_available true

# --- Persistence ---
persistence true
persistence_location /mosquitto/data/
autosave_interval 300

# --- $SYS monitoring (F1.5) ---
sys_interval 10

# --- Logging ---
log_type all
log_dest stdout

# --- Connection limits ---
max_connections -1
max_inflight_messages 100
max_queued_messages 1000

# --- TLS (production — uncomment in Sprint 5) ---
# listener 8883
# protocol mqtt
# certfile /mosquitto/config/certs/server.crt
# keyfile /mosquitto/config/certs/server.key
# cafile /mosquitto/config/certs/ca.crt
