# Mosquitto ACL Configuration
# Fleet & Asset Tracking System

# Pattern-based topic access:
#   Each device identified by username can publish only to its own topic and
#   subscribe to its own topic for receiving commands.

# Devices publish telemetry to fleet/{vehicle_id}/telemetry
pattern write fleet/%u/telemetry

# Devices can subscribe to their own command topics (future use)
pattern read fleet/%u/commands

# Bridge service reads all telemetry topics
user bridge
topic read fleet/+/telemetry

# Dashboard / API gateway subscribes to all telemetry
user gateway
topic read fleet/+/telemetry

# Admin user for testing
user admin
topic readwrite fleet/#
topic read $SYS/#
